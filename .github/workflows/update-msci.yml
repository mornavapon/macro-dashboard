name: อัปเดตข้อมูล MSCI (หน้า 3)

on:
  schedule:
    - cron: "41 23 * * *"   # ทุกวัน 06:41 น. เวลาไทย (หลัง MSCI ประกาศผลช่วงเช้ามืด)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: ติดตั้งตัวอ่าน PDF
        run: pip install -q pypdf
      - name: ดึงปฏิทินและรายชื่อหุ้นไทยที่ MSCI ปรับ
        run: python3 scripts/fetch_msci.py
      - name: บันทึกข้อมูลกลับเข้า repo
        run: |
          git config user.name "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "update MSCI data"
            git pull --rebase
            git push
          fi
