name: อัปเดตภาพวงกลมดัชนีสหรัฐฯ (หน้า 1)

on:
  schedule:
    - cron: "11 1 1,15 * *"   # วันที่ 1 และ 15 ของเดือน 08:11 น. เวลาไทย (ประมาณทุก 2 สัปดาห์)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: ดึงข้อมูลขนาดตลาดและดัชนี
        run: python3 scripts/fetch_universe.py
      - name: บันทึกข้อมูลกลับเข้า repo
        if: always()
        run: |
          git config user.name "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "update universe data"
            git pull --rebase
            git push
          fi
