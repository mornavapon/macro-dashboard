name: ทดสอบแหล่ง FDI/BOI (ชั่วคราว)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: python3 scripts/probe_fdi.py
