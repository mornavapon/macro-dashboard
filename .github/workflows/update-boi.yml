name: อัปเดต BOI ยอดขอรับส่งเสริมการลงทุนต่างชาติ (หน้า 3)

# แยกจาก workflow อื่นทั้งหมด: ถ้าพัง จะกระทบเฉพาะ data/boi.json
on:
  schedule:
    - cron: "7 2 * * *"   # ทุกวัน 09:07 น. เวลาไทย (อ่านรายงาน + ดูข่าวว่า BOI ประกาศรอบใหม่หรือยัง)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pypdf
      - name: ดึงข้อมูล
        run: python3 scripts/fetch_boi.py
      - name: บันทึกข้อมูลกลับเข้า repo
        run: |
          git config user.name "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add data/boi.json
          if ! git diff --cached --quiet; then
            git commit -m "update boi data"
            git pull --rebase
            git push
          fi
