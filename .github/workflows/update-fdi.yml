name: อัปเดต FDI เงินลงทุนโดยตรงจากต่างประเทศ (หน้า 3)

# แยกจาก workflow อื่นทั้งหมด: ถ้าพัง จะกระทบเฉพาะ data/fdi.json
on:
  schedule:
    - cron: "17 3 * * 1-5"   # จ.–ศ. 10:17 น. เวลาไทย (แบงก์ชาติออกรายไตรมาส ตรวจทุกวันทำการ)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pypdf
      - name: ดึงข้อมูล
        run: python3 scripts/fetch_fdi.py
      - name: บันทึกข้อมูลกลับเข้า repo
        run: |
          git config user.name "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add data/fdi.json
          if ! git diff --cached --quiet; then
            git commit -m "update fdi data"
            git pull --rebase
            git push
          fi
