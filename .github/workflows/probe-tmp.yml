name: probe-tmp
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pypdf
      - run: python3 scripts/probe_tmp.py
      - run: |
          git config user.name macro-bot; git config user.email macro-bot@users.noreply.github.com
          git add data/; git commit -m "probe" || true; git pull --rebase; git push
