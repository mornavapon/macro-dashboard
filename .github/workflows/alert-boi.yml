name: แจ้งเตือน BOI ประกาศยอดขอลงทุนรอบใหม่

# เตือนเมื่อจับได้ว่า BOI ประกาศตัวเลขรอบใหม่ (จากข่าว) -> ให้มาบอก Claude ดึงข้อมูล · ปีละ ~4 ครั้ง
# ปิดแจ้งเตือนอันนี้: แท็บ Actions > คลิกชื่อ workflow นี้ > ปุ่ม ... มุมขวา > Disable workflow
on:
  schedule:
    - cron: "37 2 * * *"   # ทุกวัน 09:37 น. เวลาไทย (หลังบอทอ่านข่าว BOI รอบ 09:07)
  workflow_dispatch:
    inputs:
      test:
        description: "ส่งข้อความทดสอบทันที"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: ส่งแจ้งเตือน
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC_MACRO }}
        run: python3 scripts/send_alert.py boi ${{ inputs.test && '--test' || '' }}
      - name: จำสถานะการแจ้งเตือน
        run: |
          git config user.name "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add data/alert_state.json
          if ! git diff --cached --quiet; then
            git commit -m "alert state: boi"
            git pull --rebase
            git push
          fi
