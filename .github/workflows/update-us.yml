name: อัปเดตข้อมูลอเมริกา (หน้า 2)

on:
  schedule:
    # ทุก 6 ชั่วโมง (เวลา UTC) ครอบคลุมเวลาประกาศ GDP/CPI และผลประชุมเฟด
    - cron: "41 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: ดึงข้อมูลอเมริกา
        run: python3 scripts/fetch_us.py

      - name: บันทึกข้อมูลกลับเข้า repo
        run: |
          git config user.name "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "ไม่มีข้อมูลใหม่"
          else
            git commit -m "update US data"
            git pull --rebase
            git push
          fi
