name: แจ้งเตือน ต่างชาติขายตราสารหนี้ไทยหนัก

# เตือนเมื่อเงินต่างชาติไหลออกจากตราสารหนี้ไทย รวม 5 วันทำการล่าสุด เกิน 20,000 ล้านบาท
# (เปลี่ยนเกณฑ์ได้ที่ BONDFLOW_THRESHOLD ใน scripts/send_alert.py) · เตือนครั้งเดียวต่อรอบ ไม่เตือนซ้ำทุกวัน
# ปิดแจ้งเตือนอันนี้: แท็บ Actions > คลิกชื่อ workflow นี้ > ปุ่ม ... มุมขวา > Disable workflow
on:
  schedule:
    - cron: "23 10 * * 1-5"   # จ.–ศ. 17:23 น. เวลาไทย (หลัง ThaiBMA ประกาศรอบ 16:30)
  workflow_dispatch:
    inputs:
      test:
        description: "ส่งข้อความทดสอบทันที"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: ส่งแจ้งเตือน
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC_MACRO }}
        run: python3 scripts/send_alert.py bondflow ${{ inputs.test && '--test' || '' }}
      - name: จำสถานะการแจ้งเตือน
        run: |
          git config user.name "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add data/alert_state.json
          if ! git diff --cached --quiet; then
            git commit -m "alert state: bondflow"
            git pull --rebase
            git push
          fi
