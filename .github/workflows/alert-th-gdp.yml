name: แจ้งเตือน GDP ไทย (วันที่ตัวเลขออก)

# สศช. ไม่มีปฏิทินประกาศล่วงหน้าที่ดึงได้ จึงแจ้งในวันที่ตัวเลขไตรมาสใหม่ออกแทน
# ปิดแจ้งเตือนอันนี้: แท็บ Actions > คลิกชื่อ workflow นี้ > ปุ่ม ... มุมขวา > Disable workflow
on:
  schedule:
    - cron: "13 5 * * *"   # ทุกวัน 12:13 น. เวลาไทย (สศช. แถลงช่วงเช้า)
  workflow_dispatch:
    inputs:
      test:
        description: "ส่งข้อความทดสอบทันที"
        type: boolean
        default: true

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: ส่งแจ้งเตือน
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC_MACRO }}
        run: python3 scripts/send_alert.py th_gdp ${{ inputs.test && '--test' || '' }}
