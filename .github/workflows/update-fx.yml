name: อัปเดตค่าเงินบาท USD/THB (หน้า 3)

# แยกจาก workflow อื่นทั้งหมด: ถ้าพัง จะกระทบเฉพาะ data/fx.json
on:
  schedule:
    - cron: "29 */3 * * 1-5"   # จ.–ศ. ทุก 3 ชั่วโมง
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: ดึงค่าเงินบาท
        run: python3 scripts/fetch_fx.py
      - name: บันทึกข้อมูลกลับเข้า repo
        run: |
          git config user.name "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add data/fx.json
          if ! git diff --cached --quiet; then
            git commit -m "update fx data"
            git pull --rebase
            git push
          fi
